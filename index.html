<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusPulse VIP Signals Pro</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #07090e;
      color: #e0e6ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .vip-card {
      background: linear-gradient(145deg, #121621, #0a0d14);
      border: 1px solid #1f2636;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.05);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* VIP Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2636;
      padding-bottom: 12px;
    }

    .brand {
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: #00e676;
    }

    .vip-badge {
      font-size: 11px;
      background: linear-gradient(135deg, #ffd700, #ffa500);
      color: #000;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Grid Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 10px;
      color: #787d8d;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    select {
      background: #181d29;
      border: 1px solid #2a3245;
      color: #fff;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      font-weight: 700;
      width: 100%;
    }

    select:focus {
      border-color: #ffd700;
    }

    /* Guide Box */
    .guide-box {
      background: rgba(255, 215, 0, 0.03);
      border: 1px dashed rgba(255, 215, 0, 0.2);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .buy-tag { color: #00e676; font-weight: 800; }
    .sell-tag { color: #ff5252; font-weight: 800; }

    /* TradingView Container */
    .widget-box {
      background: #090c12;
      border: 1px solid #1f2636;
      border-radius: 14px;
      overflow: hidden;
      height: 400px;
    }

    /* Send to Bot Button */
    .bot-btn {
      background: linear-gradient(135deg, #0088cc, #005580);
      border: none;
      color: white;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
      transition: all 0.2s;
    }

    .bot-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="vip-card">
    <div class="header">
      <div class="brand">⚡ NexusPulse <span>PRO</span></div>
      <div class="vip-badge">👑 VIP SIGNALS</div>
    </div>

    <!-- Parite ve Süre Seçimi -->
    <div class="controls-grid">
      <div class="control-group">
        <label for="symbolSelect">Kripto / Parite</label>
        <select id="symbolSelect" onchange="updateWidget()">
          <!-- Kripto Paralar -->
          <optgroup label="🔥 Popüler Kriptolar">
            <option value="BINANCE:BTCUSDT">BTC / USDT (Bitcoin)</option>
            <option value="BINANCE:ETHUSDT">ETH / USDT (Ethereum)</option>
            <option value="BINANCE:SOLUSDT">SOL / USDT (Solana)</option>
            <option value="BINANCE:XRPUSDT">XRP / USDT (Ripple)</option>
            <option value="BINANCE:DOGEUSDT">DOGE / USDT (Dogecoin)</option>
            <option value="BINANCE:TONUSDT">TON / USDT (Toncoin)</option>
            <option value="BINANCE:BNBUSDT">BNB / USDT (Binance)</option>
            <option value="BINANCE:AVAXUSDT">AVAX / USDT (Avalanche)</option>
            <option value="BINANCE:ADAUSDT">ADA / USDT (Cardano)</option>
          </optgroup>
          <!-- Forex Pariteleri -->
          <optgroup label="💱 Forex & OTC">
            <option value="FX:EURUSD">EUR / USD (Döviz)</option>
            <option value="FX:GBPUSD">GBP / USD (Döviz)</option>
            <option value="FX:USDJPY">USD / JPY (Döviz)</option>
          </optgroup>
        </select>
      </div>

      <div class="control-group">
        <label for="timeSelect">Süre Seçimi</label>
        <select id="timeSelect">
          <option value="3s">⚡ 3 Saniye</option>
          <option value="5s">⚡ 5 Saniye</option>
          <option value="15s">⏱ 15 Saniye</option>
          <option value="30s">⏱ 30 Saniye</option>
          <option value="1m">⏳ 1 Dakika</option>
          <option value="5m">⏳ 5 Dakika</option>
        </select>
      </div>
    </div>

    <!-- VIP Kılavuz -->
    <div class="guide-box">
      <span>👑 VIP Analiz Kararı:</span>
      <div>
        <span class="buy-tag">GÜÇLÜ AL 🟢</span> | <span class="sell-tag">GÜÇLÜ SAT 🔴</span>
      </div>
    </div>

    <!-- TradingView Canlı Gerçek Analiz İbresi -->
    <div class="widget-box" id="widgetContainer"></div>

    <!-- Bota Gönder Butonu -->
    <button class="bot-btn" onclick="sendSignalToBot()">
      ✈️ BOTA SİNYALİ GÖNDER
    </button>
  </div>

  <script>
    // Telegram WebApp Başlat
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand(); // Ekranı tam boyuta getir
    }

    function updateWidget() {
      const container = document.getElementById('widgetContainer');
      const symbol = document.getElementById('symbolSelect').value;

      container.innerHTML = '';

      const widgetDiv = document.createElement('div');
      widgetDiv.className = 'tradingview-widget-container';

      const widgetInner = document.createElement('div');
      widgetInner.className = 'tradingview-widget-container__widget';
      widgetDiv.appendChild(widgetInner);

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
      script.async = true;

      script.innerHTML = JSON.stringify({
        "interval": "1m",
        "width": "100%",
        "isTransparent": true,
        "height": "400",
        "symbol": symbol,
        "showIntervalTabs": true,
        "displayMode": "single",
        "locale": "tr",
        "colorTheme": "dark"
      });

      widgetDiv.appendChild(script);
      container.appendChild(widgetDiv);
    }

    // Seçilen Sinyali Telegram Botuna Mesaj Olarak Gönderme Fonksiyonu
    function sendSignalToBot() {
      const symbolSelect = document.getElementById('symbolSelect');
      const pairText = symbolSelect.options[symbolSelect.selectedIndex].text;
      const timeSelect = document.getElementById('timeSelect').value;

      const payload = {
        action: "VIP_SIGNAL_SELECTED",
        pair: pairText,
        timeframe: timeSelect,
        timestamp: new Date().toLocaleTimeString('tr-TR')
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`VIP Sinyal Bilgisi:\nParite: ${pairText}\nSüre: ${timeSelect}\n\n(Bu WebApp Telegram içinde açıldığında veriler doğrudan bota iletilir.)`);
      }
    }

    // İlk açılışta yükle
    updateWidget();
  </script>

</body>
</html>
