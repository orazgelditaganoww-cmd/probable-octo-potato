<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusPulse Pro - Canlı Al/Sat Sinyalleri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #e0e6ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-card {
      background: #131722;
      border: 1px solid #2a2e3d;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2e3d;
      padding-bottom: 10px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .account-tag {
      font-size: 10px;
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(0, 230, 118, 0.3);
      font-weight: 700;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      color: #787d8d;
      text-transform: uppercase;
      font-weight: 700;
    }

    select {
      background: #1e222d;
      border: 1px solid #2a2e3d;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-weight: 600;
      width: 100%;
    }

    select:focus {
      border-color: #00e676;
    }

    .guide-box {
      background: #161b22;
      border: 1px solid #2a2e3d;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .guide-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .buy-text { color: #00e676; font-weight: 800; }
    .sell-text { color: #ff5252; font-weight: 800; }

    /* TradingView Widget Kapsayıcısı */
    .widget-box {
      background: #0d1117;
      border: 1px solid #2a2e3d;
      border-radius: 12px;
      overflow: hidden;
      min-height: 420px;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <div class="brand">⚡ NexusPulse Sinyal</div>
      <div class="account-tag">DEMO & GERÇEK UYUMLU</div>
    </div>

    <!-- Parite Seçimi -->
    <div class="controls">
      <label for="symbolSelect">İşlem Yapılacak Parite</label>
      <select id="symbolSelect" onchange="updateWidget()">
        <option value="FX:EURUSD">EUR / USD (Döviz)</option>
        <option value="FX:GBPUSD">GBP / USD (Döviz)</option>
        <option value="FX:USDJPY">USD / JPY (Döviz)</option>
        <option value="BINANCE:BTCUSDT">BTC / USDT (Kripto)</option>
        <option value="BINANCE:ETHUSDT">ETH / USDT (Kripto)</option>
      </select>
    </div>

    <!-- Kullanım Kılavuzu -->
    <div class="guide-box">
      <div class="guide-item">
        <span>GÜÇLÜ AL / AL</span>
        <span class="buy-text">🟢 YEŞİL (CALL)</span>
      </div>
      <div class="guide-item">
        <span>GÜÇLÜ SAT / SAT</span>
        <span class="sell-text">🔴 KIRMIZI (PUT)</span>
      </div>
    </div>

    <!-- TradingView Canlı İndikatör Alanı -->
    <div class="widget-box" id="widgetContainer"></div>
  </div>

  <script>
    function updateWidget() {
      const container = document.getElementById('widgetContainer');
      const symbol = document.getElementById('symbolSelect').value;

      container.innerHTML = '';

      const widgetDiv = document.createElement('div');
      widgetDiv.className = 'tradingview-widget-container';

      const widgetInner = document.createElement('div');
      widgetInner.className = 'tradingview-widget-container__widget';
      widgetDiv.appendChild(widgetInner);

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
      script.async = true;

      script.innerHTML = JSON.stringify({
        "interval": "1m",
        "width": "100%",
        "isTransparent": true,
        "height": "430",
        "symbol": symbol,
        "showIntervalTabs": true,
        "displayMode": "single",
        "locale": "tr",
        "colorTheme": "dark"
      });

      widgetDiv.appendChild(script);
      container.appendChild(widgetDiv);
    }

    updateWidget();
  </script>

</body>
</html>
