<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusPulse AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0f17;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1d2e;
            border: 1px solid #2a2e45;
            border-radius: 20px;
            padding: 25px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .logo-title {
            font-size: 20px;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 15px;
        }
        .signal-result {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 35px;
        }
        .btn {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
        }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-title">⚡ NexusPulse AI</div>
        <div style="color: #a0a5ba; font-size: 14px;">EUR / USD (OTC)</div>
        <div class="signal-result" id="signal">Taýýar</div>
        <button class="btn" onclick="generateSignal()">SIGNAL AL</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function generateSignal() {
            let signalElem = document.getElementById('signal');
            signalElem.innerText = "ANALIZ EDILÝÄR...";
            signalElem.style.color = "#ffb703";

            setTimeout(() => {
                let actions = ["BUY ⬆️ (1 MIN)", "SELL ⬇️ (1 MIN)"];
                let result = actions[Math.floor(Math.random() * actions.length)];
                signalElem.innerText = result;
                signalElem.style.color = result.includes("BUY") ? "#00e676" : "#ff5252";
            }, 1200);
        }
    </script>
</body>
</html>
