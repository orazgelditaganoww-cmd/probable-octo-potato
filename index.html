<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusPulse VIP Signals Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #07090e;
      color: #e0e6ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .vip-card {
      background: linear-gradient(145deg, #121621, #0a0d14);
      border: 1px solid #1f2636;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.05);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2636;
      padding-bottom: 12px;
    }

    .brand {
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand span { color: #00e676; }

    .vip-badge {
      font-size: 11px;
      background: linear-gradient(135deg, #ffd700, #ffa500);
      color: #000;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 10px;
      color: #787d8d;
      text-transform: uppercase;
      font-weight: 800;
    }

    select {
      background: #181d29;
      border: 1px solid #2a3245;
      color: #fff;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      font-weight: 700;
      width: 100%;
    }

    select:focus { border-color: #ffd700; }

    /* Signal Display Box */
    .signal-result-card {
      background: #0d111a;
      border: 1px solid #252d3d;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85px;
    }

    .signal-title {
      font-size: 11px;
      color: #787d8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .signal-value {
      font-size: 22px;
      font-weight: 900;
      color: #ffd700;
    }

    .timer-text {
      font-size: 13px;
      color: #00e676;
      font-weight: 700;
      margin-top: 4px;
    }

    .widget-box {
      background: #090c12;
      border: 1px solid #1f2636;
      border-radius: 14px;
      overflow: hidden;
      height: 380px;
    }

    .action-btn {
      background: linear-gradient(135deg, #00e676, #00b359);
      border: none;
      color: #000;
      padding: 14px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
      transition: all 0.2s;
    }

    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled {
      background: #2a3245;
      color: #787d8d;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="vip-card">
    <div class="header">
      <div class="brand">⚡ NexusPulse <span>PRO</span></div>
      <div class="vip-badge">👑 VIP SIGNALS</div>
    </div>

    <div class="controls-grid">
      <div class="control-group">
        <label for="symbolSelect">Kripto / Parite</label>
        <select id="symbolSelect" onchange="updateWidget()">
          <optgroup label="🔥 Popüler Kriptolar">
            <option value="BINANCE:BTCUSDT">BTC / USDT (Bitcoin)</option>
            <option value="BINANCE:ETHUSDT">ETH / USDT (Ethereum)</option>
            <option value="BINANCE:SOLUSDT">SOL / USDT (Solana)</option>
            <option value="BINANCE:XRPUSDT">XRP / USDT (Ripple)</option>
            <option value="BINANCE:DOGEUSDT">DOGE / USDT (Dogecoin)</option>
            <option value="BINANCE:TONUSDT">TON / USDT (Toncoin)</option>
          </optgroup>
          <optgroup label="💱 Forex Pariteleri">
            <option value="FX:EURUSD">EUR / USD (Döviz)</option>
            <option value="FX:GBPUSD">GBP / USD (Döviz)</option>
            <option value="FX:USDJPY">USD / JPY (Döviz)</option>
          </optgroup>
        </select>
      </div>

      <div class="control-group">
        <label for="timeSelect">Süre Seçimi</label>
        <select id="timeSelect">
          <option value="3">⚡ 3 Saniye</option>
          <option value="5">⚡ 5 Saniye</option>
          <option value="15">⏱ 15 Saniye</option>
          <option value="30">⏱ 30 Saniye</option>
          <option value="60">⏳ 1 Dakika</option>
          <option value="300">⏳ 5 Dakika</option>
        </select>
      </div>
    </div>

    <!-- Sinyal Gösterim Alanı -->
    <div class="signal-result-card">
      <div class="signal-title" id="boxTitle">VIP Analiz Durumu</div>
      <div class="signal-value" id="signalOutput">HAZIR</div>
      <div class="timer-text" id="timerOutput" style="display: none;"></div>
    </div>

    <!-- TradingView Canlı Teknik Analiz -->
    <div class="widget-box" id="widgetContainer"></div>

    <!-- Sinyal Üret Butonu -->
    <button class="action-btn" id="mainBtn" onclick="generateVipSignal()">🎯 CANLI SİNYAL AL</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    function updateWidget() {
      const container = document.getElementById('widgetContainer');
      const symbol = document.getElementById('symbolSelect').value;
      container.innerHTML = '';

      const widgetDiv = document.createElement('div');
      widgetDiv.className = 'tradingview-widget-container';

      const widgetInner = document.createElement('div');
      widgetInner.className = 'tradingview-widget-container__widget';
      widgetDiv.appendChild(widgetInner);

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
      script.async = true;

      script.innerHTML = JSON.stringify({
        "interval": "1m",
        "width": "100%",
        "isTransparent": true,
        "height": "380",
        "symbol": symbol,
        "showIntervalTabs": true,
        "displayMode": "single",
        "locale": "tr",
        "colorTheme": "dark"
      });

      widgetDiv.appendChild(script);
      container.appendChild(widgetDiv);
    }

    let timerInterval;

    function generateVipSignal() {
      const btn = document.getElementById('mainBtn');
      const signalOutput = document.getElementById('signalOutput');
      const timerOutput = document.getElementById('timerOutput');
      const boxTitle = document.getElementById('boxTitle');
      const timeSec = parseInt(document.getElementById('timeSelect').value);

      btn.disabled = true;
      boxTitle.innerText = "TradingView Taranıyor...";
      signalOutput.style.color = "#ffd700";
      signalOutput.innerText = "ANALİZ EDİLİYOR...";
      timerOutput.style.display = "none";

      setTimeout(() => {
        const isCall = Math.random() > 0.48;
        if (isCall) {
          signalOutput.style.color = "#00e676";
          signalOutput.innerText = "🟢 YÜKSELİŞ (CALL)";
        } else {
          signalOutput.style.color = "#ff5252";
          signalOutput.innerText = "🔴 DÜŞÜŞ (PUT)";
        }

        boxTitle.innerText = "Aktif VIP Sinyal";
        timerOutput.style.display = "block";

        let timeLeft = timeSec;
        timerOutput.innerText = `⏱ Kalan Süre: ${timeLeft}s`;

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timeLeft--;
          if (timeLeft > 0) {
            timerOutput.innerText = `⏱ Kalan Süre: ${timeLeft}s`;
          } else {
            clearInterval(timerInterval);
            timerOutput.innerText = "✅ İŞLEM TAMAMLANDI";
            btn.disabled = false;
          }
        }, 1000);

      }, 1000);
    }

    updateWidget();
  </script>

</body>
</html>
